name: Velocity Spanish - Storybook Publish

on:
  schedule:
    - cron: '23:20 * * *'
    - cron: '04:25 * * *'
    - cron: '10:30 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional category'
        required: false
        default: ''
      theme:
        description: 'Optional palette'
        required: false
        default: ''
      world:
        description: 'Optional world'
        required: false
        default: ''
      cast:
        description: 'Optional cast'
        required: false
        default: ''
      phrases:
        description: 'Optional phrase count'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: velocity-ve-spayoutub
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize history if not found
        run: |
          mkdir -p output/history
          if [ ! -f "output/history/all_generated_phrases.json" ]; then
            echo '{"phrases": [], "last_updated": null}' > output/history/all_generated_phrases.json
          fi
          if [ ! -f "output/history/recent_categories.json" ]; then
            echo '{"recent_categories": [], "last_updated": null}' > output/history/recent_categories.json
          fi
          if [ ! -f "output/history/storybook_theme_deck.json" ]; then
            echo '{"deck": [], "recent": [], "updated": null}' > output/history/storybook_theme_deck.json
          fi
          if [ ! -f "output/history/storybook_set_deck.json" ]; then
            echo '{"deck": [], "recent": [], "updated": null}' > output/history/storybook_set_deck.json
          fi
          if [ ! -f "output/history/storybook_cast.json" ]; then
            echo '{"recent": [], "updated": null}' > output/history/storybook_cast.json
          fi
          python -c "import json; print('History phrases:', len(json.load(open('output/history/all_generated_phrases.json'))['phrases']))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r upload/requirements.txt

      - name: Install Chromium for rendering
        run: python -m playwright install --with-deps chromium

      - name: Create .env from secrets
        env:
          AI_MODEL_SECRET: ${{ secrets.AI_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          : > .env
          echo "AI_MODEL=${AI_MODEL_SECRET:-gemini-fast}" >> .env
          for key in POLLINATIONS_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN \
            YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN \
            INSTAGRAM_ACCESS_TOKEN INSTAGRAM_ACCOUNT_ID IG_ACCESS_TOKEN \
            FACEBOOK_ACCESS_TOKEN FACEBOOK_PAGE_ID FB_PAGE_ACCESS_TOKEN FB_PAGE_ID META_ACCESS_TOKEN \
            THREADS_ACCESS_TOKEN THREADS_USER_ID TIKTOK_ACCESS_TOKEN TWITTER_API_KEY \
            TWITTER_API_SECRET TWITTER_ACCESS_TOKEN TWITTER_ACCESS_SECRET VK_ACCESS_TOKEN \
            VK_GROUP_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID TELEGRAM_CHAT_ID CHAT_ID; do
            value="$(printenv "$key" || true)"
            echo "$key=$value" >> .env
          done
          echo ".env written ($(wc -l < .env) lines)"

      - name: Build storybook reel
        env:
          CATEGORY: ${{ github.event.inputs.category }}
          THEME: ${{ github.event.inputs.theme }}
          WORLD: ${{ github.event.inputs.world }}
          CAST: ${{ github.event.inputs.cast }}
          PHRASES: ${{ github.event.inputs.phrases }}
        run: |
          args=(--recipe storybook-3)
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          if [ -n "$THEME" ]; then args+=(--theme "$THEME"); fi
          if [ -n "$WORLD" ]; then args+=(--world "$WORLD"); fi
          if [ -n "$CAST" ]; then args+=(--cast "$CAST"); fi
          if [ -n "$PHRASES" ]; then args+=(--phrases "$PHRASES"); fi
          python build.py "${args[@]}"
          echo ""
          ls -la output/lessons/*/ | tail -20

      - name: Validate reel
        run: python validate.py

      - name: Publish to all platforms
        run: python upload_all_platforms.py --platforms youtube --require youtube

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-ve-spayoutub-reel-${{ github.run_number }}
          path: |
            output/lessons/*/final_reel.mp4
            output/lessons/*/thumbnail.jpg
            output/lessons/*/metadata.json
            output/lessons/*/timeline.json
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: |
            output/history/*.json
            output/upload_results_*.json
          retention-days: 14

      - name: Commit rotation and phrase history
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for file in \
            output/history/all_generated_phrases.json \
            output/history/recent_categories.json \
            output/history/storybook_theme_deck.json \
            output/history/storybook_set_deck.json \
            output/history/storybook_cast.json \
            output/history/generated_themes.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "Storybook rotation - Run #${{ github.run_number }}"
            git pull --rebase
            git push
            echo "Rotation state committed - next run gets a fresh theme and world"
          else
            echo "No history changes"
          fi
